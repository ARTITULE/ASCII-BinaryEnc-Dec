<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Binary Encoder/Decoder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="Icons/favicon.svg">
</head>
<body>
    <div class="app">

        <h1>ASCII Binary Encoder/Decoder</h1>

        <textarea name="input" id="input" placeholder="Enter text or binary here.."></textarea>

        <div>
            <button id="toBinary">Text to Binary</button>
            <button id="toText">Binary to Text</button>
        </div>

        <h2>Output</h2>

        <textarea name="output" id="output" readonly></textarea>

        <div class="github-link">
            <a href="https://github.com/ARTITULE/ASCII-BinaryEnc-Dec" target="_blank" rel="noopener noreferrer">
                <img src="Icons/github.svg" alt="github_icon">
                <span>View this project on GitHub</span>
            </a>
        </div>
        <script src="index.js"></script>
    </div>
    
</body>
</html>
